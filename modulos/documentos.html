<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Documentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/layout.css" rel="stylesheet">
  <style>
    /* Estilos específicos deste módulo. O resto (sidebar, topbar, cards,
       botões, seções) vem de assets/layout.css. */

    .doc-busca {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .doc-busca i { color: #888; }
    .doc-busca input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      padding: 6px 0;
    }

    .doc-lista { display: flex; flex-direction: column; gap: 1px; }
    .doc-linha {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 6px;
      border-bottom: 1px solid #eee;
    }
    .doc-linha:last-child { border-bottom: none; }
    .doc-codigo {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: var(--qc-primary);
      background: #eef2ff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      flex-shrink: 0;
      min-width: 58px;
      text-align: center;
    }
    .doc-titulo { flex: 1; min-width: 0; font-size: 13.5px; color: #333; }
    .doc-rev {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      background: #eee;
      padding: 3px 9px;
      border-radius: 12px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .doc-btn-baixar {
      flex-shrink: 0;
      white-space: nowrap;
    }

    .qc-card.doc-vazio-categoria { display: none; }

    #doc-estado-vazio, #doc-estado-erro, #doc-estado-carregando {
      display: none;
    }
  </style>
</head>
<body class="qc-body">

  <div id="qc-page-content">

    <div class="doc-busca">
      <i class="bi bi-search"></i>
      <input type="text" id="doc-busca-input" placeholder="Buscar por código ou título (ex: PG 04, Ações corretivas...)">
    </div>

    <div id="doc-estado-carregando" class="qc-aviso-vazio">Carregando documentos...</div>

    <div id="doc-estado-erro" class="qc-aviso-vazio">
      Não foi possível carregar a biblioteca agora. Tente recarregar a página.
    </div>

    <div id="doc-estado-vazio" class="qc-aviso-vazio">
      Ainda não há documentos cadastrados na biblioteca.
    </div>

    <div id="doc-categorias"></div>

  </div>

  <script type="module">
    import { auth, db, storage } from '../firebase-config.js';
    import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
    import { initLayout, escapeHtml } from '../assets/layout.js';

    // Ordem fixa de exibição das categorias (independe da ordem alfabética).
    const ORDEM_CATEGORIAS = [
      'Manual da Qualidade',
      'Procedimentos Gerais',
      'Instrução de Trabalho',
      'Descrição de Funções'
    ];

    let documentosCarregados = [];

    initLayout({
      auth, db,
      activeSlug: 'documentos',
      pageTitle: 'Biblioteca de Documentos',
      breadcrumb: 'Qualidade',
      homeHref: '../index.html'
    }).then(() => {
      carregarBiblioteca();
      document.getElementById('doc-busca-input').addEventListener('input', renderizarBiblioteca);
    }).catch(err => console.error('Falha ao montar layout:', err));

    async function carregarBiblioteca() {
      mostrarEstado('carregando');
      try {
        const q = query(collection(db, 'biblioteca_documentos'), orderBy('codigo'));
        const snap = await getDocs(q);
        documentosCarregados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderizarBiblioteca();
      } catch (err) {
        console.error('Erro ao carregar biblioteca de documentos:', err);
        mostrarEstado('erro');
      }
    }

    function mostrarEstado(nome) {
      document.getElementById('doc-estado-carregando').style.display = nome === 'carregando' ? 'block' : 'none';
      document.getElementById('doc-estado-erro').style.display = nome === 'erro' ? 'block' : 'none';
      document.getElementById('doc-estado-vazio').style.display = nome === 'vazio' ? 'block' : 'none';
      document.getElementById('doc-categorias').style.display = nome === 'ok' ? 'block' : 'none';
    }

    function renderizarBiblioteca() {
      if (!documentosCarregados.length) {
        mostrarEstado('vazio');
        return;
      }

      const termo = document.getElementById('doc-busca-input').value.trim().toLowerCase();
      const filtrados = !termo ? documentosCarregados : documentosCarregados.filter(doc => {
        const alvo = `${doc.codigo || ''} ${doc.titulo || ''}`.toLowerCase();
        return alvo.includes(termo);
      });

      if (!filtrados.length) {
        mostrarEstado('vazio');
        document.getElementById('doc-estado-vazio').textContent = 'Nenhum documento encontrado para essa busca.';
        return;
      }

      mostrarEstado('ok');

      const porCategoria = {};
      filtrados.forEach(doc => {
        const cat = doc.categoria || 'Outros';
        if (!porCategoria[cat]) porCategoria[cat] = [];
        porCategoria[cat].push(doc);
      });

      const categorias = Object.keys(porCategoria).sort((a, b) => {
        const ia = ORDEM_CATEGORIAS.indexOf(a);
        const ib = ORDEM_CATEGORIAS.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });

      const alvo = document.getElementById('doc-categorias');
      alvo.innerHTML = categorias.map(cat => {
        const docs = porCategoria[cat].slice().sort((a, b) => (a.codigo || '').localeCompare(b.codigo || '', 'pt-BR', { numeric: true }));
        return `
          <div class="qc-card">
            <div class="qc-section-title">${escapeHtml(cat)}</div>
            <div class="doc-lista">
              ${docs.map(doc => `
                <div class="doc-linha">
                  <span class="doc-codigo">${escapeHtml(doc.codigo || '')}</span>
                  <span class="doc-titulo">${escapeHtml(doc.titulo || '')}</span>
                  ${doc.revisao ? `<span class="doc-rev">Rev. ${escapeHtml(doc.revisao)}</span>` : ''}
                  <button type="button" class="qc-btn qc-btn-primary doc-btn-baixar" data-storage-path="${escapeHtml(doc.storagePath || '')}">
                    <i class="bi bi-download"></i> Baixar
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      alvo.querySelectorAll('.doc-btn-baixar').forEach(btn => {
        btn.addEventListener('click', () => baixarDocumento(btn));
      });
    }

    async function baixarDocumento(btn) {
      const storagePath = btn.dataset.storagePath;
      if (!storagePath) {
        alert('Este documento ainda não tem um arquivo associado.');
        return;
      }
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Abrindo...';
      try {
        const url = await getDownloadURL(ref(storage, storagePath));
        window.open(url, '_blank');
      } catch (err) {
        console.error('Erro ao baixar documento:', err);
        alert('Não foi possível baixar este documento agora.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    }
  </script>
</body>
</html>
