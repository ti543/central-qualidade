<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Documentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/layout.css" rel="stylesheet">
  <!-- Lê o .docx inteiro no navegador (nada é enviado pra nenhum servidor além
       do texto extraído, que vai pro Firestore igual a edição manual). -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>
  <!-- Gera o PDF de exportação inteiramente no navegador. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Estilos específicos deste módulo. O resto (sidebar, topbar, cards,
       botões, seções) vem de assets/layout.css. */

    .doc-topo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .doc-busca {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      flex: 1;
      min-width: 220px;
    }
    .doc-busca i { color: #888; }
    .doc-busca input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      padding: 6px 0;
    }

    .doc-lista { display: flex; flex-direction: column; gap: 1px; }
    .doc-linha {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 6px;
      border-bottom: 1px solid #eee;
    }
    .doc-linha:last-child { border-bottom: none; }
    .doc-codigo {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: var(--qc-primary);
      background: #eef2ff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      flex-shrink: 0;
      min-width: 58px;
      text-align: center;
    }
    .doc-titulo { flex: 1; min-width: 0; font-size: 13.5px; color: #333; cursor: pointer; }
    .doc-titulo:hover { text-decoration: underline; color: var(--qc-primary); }
    .doc-rev {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      background: #eee;
      padding: 3px 9px;
      border-radius: 12px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .doc-linha-acoes { display: flex; gap: 6px; flex-shrink: 0; }
    .doc-linha-acoes .qc-btn { padding: 5px 10px; font-size: 12px; }

    #doc-estado-vazio, #doc-estado-erro, #doc-estado-carregando {
      display: none;
    }

    /* FICHA DE LEITURA / EDIÇÃO (drawer) */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 9000; }
    .drawer-overlay.open { display: block; }
    .drawer-panel {
      position: fixed; top: 0; right: -720px; width: 720px; max-width: 96vw; height: 100vh;
      background: #f4f6f9; z-index: 9001; box-shadow: -6px 0 25px rgba(0,0,0,.25);
      transition: right .25s ease; overflow-y: auto;
    }
    .drawer-panel.open { right: 0; }
    .drawer-header {
      background: var(--qc-primary); color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 2;
    }
    .drawer-header h2 { font-size: 15px; text-transform: uppercase; margin: 0; }
    .drawer-header .sub { font-size: 11px; opacity: .85; font-weight: normal; text-transform: none; }
    .drawer-close { background: rgba(255,255,255,.15); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; flex-shrink: 0; }
    .drawer-body { padding: 18px 20px; }

    .doc-meta-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px;
      background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 16px;
    }
    .doc-meta-grid .k { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; display: block; }
    .doc-meta-grid .val { font-size: 13px; font-weight: bold; color: #000050; display: block; }

    .doc-conteudo-leitura {
      background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 18px;
      white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; color: #333;
      min-height: 120px;
    }

    .doc-form label { display: block; font-size: 11px; font-weight: bold; color: #666; margin: 12px 0 4px; text-transform: uppercase; }
    .doc-form input[type="text"], .doc-form select, .doc-form textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; font-family: inherit;
    }
    .doc-form textarea { min-height: 320px; resize: vertical; white-space: pre-wrap; }
    .doc-form .doc-form-linha { display: flex; gap: 10px; }
    .doc-form .doc-form-linha > div { flex: 1; }
    .doc-form-rodape { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }

    .doc-historico-item {
      background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px;
    }
    .doc-historico-item summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--qc-primary); }
    .doc-historico-item .doc-conteudo-leitura { margin-top: 10px; font-size: 12.5px; }
    .doc-aviso-historico-vazio { color: #888; font-size: 12.5px; padding: 10px; }

    /* IMPORTAÇÃO EM LOTE A PARTIR DE ARQUIVOS .DOCX */
    .doc-import-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .doc-import-tabela th {
      background: var(--qc-primary); color: #fff; text-align: left; padding: 7px 8px; font-size: 11px; text-transform: uppercase;
    }
    .doc-import-tabela td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .doc-import-tabela input, .doc-import-tabela select {
      width: 100%; padding: 5px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit;
    }
    .doc-import-tabela .doc-import-arquivo { font-size: 11px; color: #888; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-import-tabela .doc-import-status { font-size: 11px; font-weight: 700; white-space: nowrap; }
    .doc-import-tabela .doc-import-status.novo { color: #006100; }
    .doc-import-tabela .doc-import-status.atualiza { color: #9c6500; }
    .doc-import-tabela .doc-import-remover { color: #9c0006; cursor: pointer; background: none; border: none; font-size: 15px; }
    .doc-import-rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
    .doc-import-aviso-ignorados { font-size: 12px; color: #9c6500; margin-top: 10px; }
    .doc-import-progresso { font-size: 12.5px; color: #555; }
  </style>
</head>
<body class="qc-body">

  <div id="qc-page-content">

    <div class="doc-topo">
      <div class="doc-busca">
        <i class="bi bi-search"></i>
        <input type="text" id="doc-busca-input" placeholder="Buscar por código ou título (ex: PG 04, Ações corretivas...)">
      </div>
      <button type="button" class="qc-btn edit-only" id="doc-btn-importar" style="display:none;">
        <i class="bi bi-file-earmark-word"></i> Importar do Word
      </button>
      <button type="button" class="qc-btn qc-btn-primary edit-only" id="doc-btn-novo" style="display:none;">
        <i class="bi bi-plus-lg"></i> Novo documento
      </button>
      <input type="file" id="doc-import-input" accept=".docx" multiple style="display:none;">
    </div>

    <div id="doc-importacao-area"></div>

    <div id="doc-estado-carregando" class="qc-aviso-vazio">Carregando documentos...</div>
    <div id="doc-estado-erro" class="qc-aviso-vazio">Não foi possível carregar a biblioteca agora. Tente recarregar a página.</div>
    <div id="doc-estado-vazio" class="qc-aviso-vazio">Ainda não há documentos cadastrados na biblioteca.</div>

    <div id="doc-categorias"></div>

  </div>

  <!-- DRAWER: leitura / edição -->
  <div class="drawer-overlay" id="doc-drawer-overlay"></div>
  <div class="drawer-panel" id="doc-drawer">
    <div class="drawer-header">
      <div>
        <h2 id="doc-drawer-titulo">Documento</h2>
        <div class="sub" id="doc-drawer-subtitulo"></div>
      </div>
      <button type="button" class="drawer-close" id="doc-drawer-fechar">✕</button>
    </div>
    <div class="drawer-body" id="doc-drawer-corpo"></div>
  </div>

  <script type="module">
    import { auth, db } from '../firebase-config.js';
    import {
      collection, query, orderBy, onSnapshot, doc, setDoc, updateDoc, addDoc,
      getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initLayout, escapeHtml } from '../assets/layout.js';

    const CATEGORIAS_PADRAO = ['Manual da Qualidade', 'Procedimentos Gerais', 'Instrução de Trabalho', 'Descrição de Funções'];

    let documentosCarregados = [];
    let podeEditar = false;
    let perfilAtual = null;
    let docEmEdicaoId = null; // null = criando novo

    initLayout({
      auth, db,
      activeSlug: 'documentos',
      pageTitle: 'Biblioteca de Documentos',
      breadcrumb: 'Qualidade',
      isoDocId: 'documentos',
      isoCollection: 'modulo_config',
      isoEditLevel: 'qualidade',
      homeHref: '../index.html'
    }).then(({ perfil, souQualidade }) => {
      perfilAtual = perfil;
      podeEditar = !!souQualidade;
      document.querySelectorAll('.edit-only').forEach(el => el.style.display = podeEditar ? 'inline-flex' : 'none');

      document.getElementById('doc-busca-input').addEventListener('input', renderizarBiblioteca);
      document.getElementById('doc-btn-novo').addEventListener('click', () => abrirEdicao(null));
      document.getElementById('doc-btn-importar').addEventListener('click', () => document.getElementById('doc-import-input').click());
      document.getElementById('doc-import-input').addEventListener('change', (e) => {
        const arquivos = Array.from(e.target.files || []);
        e.target.value = ''; // permite selecionar os mesmos arquivos de novo depois
        if (arquivos.length) processarImportacao(arquivos);
      });
      document.getElementById('doc-drawer-fechar').addEventListener('click', fecharDrawer);
      document.getElementById('doc-drawer-overlay').addEventListener('click', fecharDrawer);

      escutarBiblioteca();
    }).catch(err => console.error('Falha ao montar layout:', err));

    function escutarBiblioteca() {
      mostrarEstado('carregando');
      const q = query(collection(db, 'biblioteca_documentos'), orderBy('codigo'));
      onSnapshot(q, (snap) => {
        documentosCarregados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderizarBiblioteca();
      }, (err) => {
        console.error('Erro ao carregar biblioteca de documentos:', err);
        mostrarEstado('erro');
      });
    }

    function mostrarEstado(nome) {
      document.getElementById('doc-estado-carregando').style.display = nome === 'carregando' ? 'block' : 'none';
      document.getElementById('doc-estado-erro').style.display = nome === 'erro' ? 'block' : 'none';
      document.getElementById('doc-estado-vazio').style.display = nome === 'vazio' ? 'block' : 'none';
      document.getElementById('doc-categorias').style.display = nome === 'ok' ? 'block' : 'none';
    }

    function renderizarBiblioteca() {
      if (!documentosCarregados.length) {
        mostrarEstado('vazio');
        document.getElementById('doc-estado-vazio').textContent = 'Ainda não há documentos cadastrados na biblioteca.';
        return;
      }

      const termo = document.getElementById('doc-busca-input').value.trim().toLowerCase();
      const filtrados = !termo ? documentosCarregados : documentosCarregados.filter(d => {
        const alvo = `${d.codigo || ''} ${d.titulo || ''}`.toLowerCase();
        return alvo.includes(termo);
      });

      if (!filtrados.length) {
        mostrarEstado('vazio');
        document.getElementById('doc-estado-vazio').textContent = 'Nenhum documento encontrado para essa busca.';
        return;
      }

      mostrarEstado('ok');

      const porCategoria = {};
      filtrados.forEach(d => {
        const cat = d.categoria || 'Outros';
        if (!porCategoria[cat]) porCategoria[cat] = [];
        porCategoria[cat].push(d);
      });

      const categorias = Object.keys(porCategoria).sort((a, b) => {
        const ia = CATEGORIAS_PADRAO.indexOf(a);
        const ib = CATEGORIAS_PADRAO.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b, 'pt-BR');
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });

      const alvo = document.getElementById('doc-categorias');
      alvo.innerHTML = categorias.map(cat => {
        const docs = porCategoria[cat].slice().sort((a, b) => (a.codigo || '').localeCompare(b.codigo || '', 'pt-BR', { numeric: true }));
        return `
          <div class="qc-card">
            <div class="qc-section-title">${escapeHtml(cat)}</div>
            <div class="doc-lista">
              ${docs.map(d => `
                <div class="doc-linha">
                  <span class="doc-codigo">${escapeHtml(d.codigo || '')}</span>
                  <span class="doc-titulo" data-ler="${escapeHtml(d.id)}">${escapeHtml(d.titulo || '')}</span>
                  ${d.revisao ? `<span class="doc-rev">Rev. ${escapeHtml(d.revisao)}</span>` : ''}
                  <div class="doc-linha-acoes">
                    <button type="button" class="qc-btn" data-ler="${escapeHtml(d.id)}">Ler</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      alvo.querySelectorAll('[data-ler]').forEach(el => {
        el.addEventListener('click', () => abrirLeitura(el.dataset.ler));
      });
    }

    function proximaCategoriaCustomOuPadrao(valorSelect, valorTexto) {
      return valorSelect === '__outra__' ? (valorTexto || '').trim() : valorSelect;
    }

    function slugificar(texto) {
      return (texto || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-zA-Z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .toLowerCase();
    }

    function proximaRevisao(revisaoAtual) {
      const n = parseInt(revisaoAtual, 10);
      const proximo = (isNaN(n) ? 0 : n) + 1;
      return String(proximo).padStart(2, '0');
    }

    // ---------------------------------------------------------------
    // IMPORTAÇÃO EM LOTE A PARTIR DE ARQUIVOS .DOCX
    // Lê o arquivo inteiro no navegador (mammoth.js) — nada é enviado
    // pra nenhum servidor. Só o texto extraído vai pro Firestore quando
    // o usuário confirma a importação.
    // ---------------------------------------------------------------
    const PADRAO_NOME_ARQUIVO = /^(?<codigo>[A-Za-zÀ-ÿ]{1,4}\s?\d{0,3})\s*-\s*(?<resto>.+)$/;
    const PADRAO_REVISAO_ARQUIVO = /\s+rev\.?\s*(\d{1,3})\s*$/i;
    const CATEGORIA_POR_PREFIXO = {
      'PG': 'Procedimentos Gerais',
      'IT': 'Instrução de Trabalho',
      'DF': 'Descrição de Funções',
      'MQ': 'Manual da Qualidade'
    };

    let listaImportacao = [];

    function interpretarNomeArquivo(nomeSemExtensao) {
      if (/teste|rascunho/i.test(nomeSemExtensao)) return null;
      const m = PADRAO_NOME_ARQUIVO.exec(nomeSemExtensao.trim());
      if (!m) return null;

      const codigo = m.groups.codigo.replace(/\s+/g, ' ').trim().toUpperCase();
      const resto = m.groups.resto.trim();
      const revMatch = PADRAO_REVISAO_ARQUIVO.exec(resto);
      let revisao = 0;
      let titulo = resto;
      if (revMatch) {
        revisao = parseInt(revMatch[1], 10);
        titulo = resto.slice(0, revMatch.index).trim();
      }
      return { codigo, titulo, revisao };
    }

    function categoriaPorPrefixo(codigo) {
      const prefixo = (codigo.split(' ')[0] || '').toUpperCase();
      return CATEGORIA_POR_PREFIXO[prefixo] || '';
    }

    async function processarImportacao(arquivos) {
      const area = document.getElementById('doc-importacao-area');
      area.innerHTML = `<div class="qc-card"><div class="doc-import-progresso" id="doc-import-progresso">Lendo arquivos...</div></div>`;

      const candidatosPorChave = {};
      const ignorados = [];

      for (let i = 0; i < arquivos.length; i++) {
        const arquivo = arquivos[i];
        const progresso = document.getElementById('doc-import-progresso');
        if (progresso) progresso.textContent = `Lendo ${i + 1} de ${arquivos.length}: ${arquivo.name}`;

        const nomeSemExt = arquivo.name.replace(/\.docx?$/i, '');
        const interpretado = interpretarNomeArquivo(nomeSemExt);
        if (!interpretado) {
          ignorados.push(arquivo.name);
          continue;
        }

        let texto = '';
        try {
          const buf = await arquivo.arrayBuffer();
          const resultado = await mammoth.extractRawText({ arrayBuffer: buf });
          texto = resultado.value || '';
        } catch (err) {
          console.error('Erro ao ler', arquivo.name, err);
          ignorados.push(`${arquivo.name} (não consegui ler o conteúdo)`);
          continue;
        }

        const categoria = categoriaPorPrefixo(interpretado.codigo);
        const chave = `${slugificar(categoria)}--${slugificar(interpretado.codigo)}`;
        const candidato = {
          chave,
          categoria,
          codigo: interpretado.codigo,
          titulo: interpretado.titulo,
          revisao: interpretado.revisao,
          conteudo: texto,
          nomeArquivo: arquivo.name
        };

        // Se dois arquivos selecionados caem no mesmo código, fica só a
        // revisão mais alta (mesma lógica de quando se busca a pasta inteira).
        if (!candidatosPorChave[chave] || candidato.revisao > candidatosPorChave[chave].revisao) {
          candidatosPorChave[chave] = candidato;
        }
      }

      listaImportacao = Object.values(candidatosPorChave);
      renderizarRevisaoImportacao(ignorados);
    }

    function renderizarRevisaoImportacao(ignorados) {
      const area = document.getElementById('doc-importacao-area');

      if (!listaImportacao.length) {
        area.innerHTML = `
          <div class="qc-card">
            <div class="qc-section-title">Importação</div>
            <p class="doc-aviso-historico-vazio">Nenhum arquivo reconhecido. Os nomes precisam seguir o padrão "CÓDIGO - Título rev.NN.docx" (ex: "PG 04 - Ações corretivas e preventivas rev.03.docx").</p>
          </div>
        `;
        return;
      }

      area.innerHTML = `
        <div class="qc-card">
          <div class="qc-section-title">Revise antes de importar (${listaImportacao.length} documento(s))</div>
          <div class="table-responsive" style="overflow-x:auto;">
            <table class="doc-import-tabela">
              <thead>
                <tr>
                  <th style="width:18%;">Categoria</th>
                  <th style="width:10%;">Código</th>
                  <th>Título</th>
                  <th style="width:8%;">Revisão</th>
                  <th style="width:12%;">Situação</th>
                  <th style="width:18%;">Arquivo</th>
                  <th style="width:4%;"></th>
                </tr>
              </thead>
              <tbody id="doc-import-tbody"></tbody>
            </table>
          </div>
          ${ignorados && ignorados.length ? `
            <div class="doc-import-aviso-ignorados">
              <i class="bi bi-exclamation-triangle"></i> ${ignorados.length} arquivo(s) ignorado(s) (nome fora do padrão ou arquivo de teste):
              <br>${ignorados.map(n => escapeHtml(n)).join('<br>')}
            </div>
          ` : ''}
          <div class="doc-import-rodape">
            <button type="button" class="qc-btn" id="doc-import-cancelar">Cancelar</button>
            <button type="button" class="qc-btn qc-btn-primary" id="doc-import-confirmar">
              <i class="bi bi-cloud-upload"></i> Importar ${listaImportacao.length} documento(s)
            </button>
          </div>
        </div>
      `;

      renderizarLinhasImportacao();
      document.getElementById('doc-import-cancelar').addEventListener('click', () => {
        listaImportacao = [];
        document.getElementById('doc-importacao-area').innerHTML = '';
      });
      document.getElementById('doc-import-confirmar').addEventListener('click', confirmarImportacao);
    }

    function renderizarLinhasImportacao() {
      const tbody = document.getElementById('doc-import-tbody');
      tbody.innerHTML = listaImportacao.map((c, i) => {
        const existente = documentosCarregados.find(d => d.id === c.chave);
        const situacao = existente
          ? `<span class="doc-import-status atualiza">Nova revisão de ${escapeHtml(existente.codigo)}</span>`
          : `<span class="doc-import-status novo">Documento novo</span>`;
        return `
          <tr data-indice="${i}">
            <td>
              <select class="doc-import-campo" data-campo="categoria" data-indice="${i}">
                ${CATEGORIAS_PADRAO.map(cat => `<option value="${escapeHtml(cat)}" ${cat === c.categoria ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
                <option value="${escapeHtml(c.categoria)}" ${!CATEGORIAS_PADRAO.includes(c.categoria) ? 'selected' : ''} ${CATEGORIAS_PADRAO.includes(c.categoria) ? 'style="display:none;"' : ''}>${escapeHtml(c.categoria || '(defina a categoria)')}</option>
              </select>
            </td>
            <td><input type="text" class="doc-import-campo" data-campo="codigo" data-indice="${i}" value="${escapeHtml(c.codigo)}"></td>
            <td><input type="text" class="doc-import-campo" data-campo="titulo" data-indice="${i}" value="${escapeHtml(c.titulo)}"></td>
            <td><input type="text" class="doc-import-campo" data-campo="revisao" data-indice="${i}" value="${c.revisao ? String(c.revisao).padStart(2, '0') : ''}"></td>
            <td>${situacao}</td>
            <td class="doc-import-arquivo" title="${escapeHtml(c.nomeArquivo)}">${escapeHtml(c.nomeArquivo)}</td>
            <td><button type="button" class="doc-import-remover" data-remover="${i}" title="Remover da lista">✕</button></td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.doc-import-campo').forEach(el => {
        el.addEventListener('change', (e) => {
          const i = parseInt(e.target.dataset.indice, 10);
          const campo = e.target.dataset.campo;
          listaImportacao[i][campo] = e.target.value;
        });
      });
      tbody.querySelectorAll('[data-remover]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const i = parseInt(e.target.dataset.remover, 10);
          listaImportacao.splice(i, 1);
          if (!listaImportacao.length) {
            document.getElementById('doc-importacao-area').innerHTML = '';
          } else {
            renderizarRevisaoImportacao();
          }
        });
      });
    }

    async function confirmarImportacao() {
      const btn = document.getElementById('doc-import-confirmar');
      btn.disabled = true;

      let ok = 0;
      const falhas = [];

      for (let i = 0; i < listaImportacao.length; i++) {
        const c = listaImportacao[i];
        btn.innerHTML = `<i class="bi bi-hourglass-split"></i> Importando ${i + 1} de ${listaImportacao.length}...`;

        if (!c.categoria || !c.codigo || !c.titulo) {
          falhas.push(`${c.nomeArquivo} (faltou categoria, código ou título)`);
          continue;
        }

        try {
          const chave = `${slugificar(c.categoria)}--${slugificar(c.codigo)}`;
          const docRef = doc(db, 'biblioteca_documentos', chave);
          const existente = documentosCarregados.find(d => d.id === chave);
          const revisaoFinal = c.revisao ? String(c.revisao).padStart(2, '0') : '';

          if (existente) {
            await addDoc(collection(docRef, 'versoes_obsoletas'), {
              revisao: existente.revisao || '',
              titulo: existente.titulo || '',
              conteudo: existente.conteudo || '',
              obsoletoEm: serverTimestamp()
            });
          }

          await setDoc(docRef, {
            categoria: c.categoria,
            codigo: c.codigo,
            titulo: c.titulo,
            conteudo: c.conteudo,
            revisao: revisaoFinal,
            atualizadoEm: serverTimestamp(),
            atualizadoPor: (perfilAtual && perfilAtual.unidade) || ''
          });

          ok++;
        } catch (err) {
          console.error('Erro ao importar', c.nomeArquivo, err);
          falhas.push(c.nomeArquivo);
        }
      }

      listaImportacao = [];
      const area = document.getElementById('doc-importacao-area');
      area.innerHTML = `
        <div class="qc-card">
          <div class="qc-section-title">Importação concluída</div>
          <p>${ok} documento(s) importado(s) com sucesso.</p>
          ${falhas.length ? `<p class="doc-import-aviso-ignorados">${falhas.length} falharam: ${falhas.map(f => escapeHtml(f)).join(', ')}</p>` : ''}
          <button type="button" class="qc-btn" id="doc-import-fechar-resultado">Fechar</button>
        </div>
      `;
      document.getElementById('doc-import-fechar-resultado').addEventListener('click', () => { area.innerHTML = ''; });
    }

    // ---------------------------------------------------------------
    // DRAWER — LEITURA
    // ---------------------------------------------------------------
    function abrirLeitura(id) {
      const d = documentosCarregados.find(x => x.id === id);
      if (!d) return;

      document.getElementById('doc-drawer-titulo').textContent = d.titulo || '(sem título)';
      document.getElementById('doc-drawer-subtitulo').textContent = `${d.categoria || ''} · ${d.codigo || ''} · Revisão ${d.revisao || '—'}`;

      const corpo = document.getElementById('doc-drawer-corpo');
      corpo.innerHTML = `
        <div class="doc-meta-grid">
          <div><span class="k">Código</span><span class="val">${escapeHtml(d.codigo || '')}</span></div>
          <div><span class="k">Categoria</span><span class="val">${escapeHtml(d.categoria || '')}</span></div>
          <div><span class="k">Revisão</span><span class="val">${escapeHtml(d.revisao || '—')}</span></div>
        </div>
        <div class="doc-conteudo-leitura">${escapeHtml(d.conteudo || '(documento ainda sem conteúdo)')}</div>
        <div class="doc-form-rodape">
          <div>
            <button type="button" class="qc-btn" id="doc-btn-exportar-pdf"><i class="bi bi-file-earmark-pdf"></i> Exportar em PDF</button>
            ${podeEditar ? `<button type="button" class="qc-btn" id="doc-btn-historico">Ver revisões anteriores</button>` : ''}
          </div>
          ${podeEditar ? `<button type="button" class="qc-btn qc-btn-primary" id="doc-btn-editar-do-drawer">Editar / nova revisão</button>` : ''}
        </div>
        <div id="doc-historico-area"></div>
      `;

      document.getElementById('doc-btn-exportar-pdf').addEventListener('click', () => exportarPdf(d));
      if (podeEditar) {
        document.getElementById('doc-btn-editar-do-drawer').addEventListener('click', () => abrirEdicao(id));
        document.getElementById('doc-btn-historico').addEventListener('click', () => carregarHistorico(id));
      }

      abrirDrawer();
    }

    // ---------------------------------------------------------------
    // EXPORTAÇÃO EM PDF — gerada inteiramente no navegador (jsPDF),
    // nada é enviado pra nenhum servidor.
    // ---------------------------------------------------------------
    function exportarPdf(d) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('Não foi possível carregar o gerador de PDF agora. Verifique sua conexão e tente de novo.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
      const margemEsq = 50;
      const margemDir = 50;
      const larguraUtil = pdf.internal.pageSize.getWidth() - margemEsq - margemDir;
      const alturaPagina = pdf.internal.pageSize.getHeight();
      let y = 55;

      function quebraDePaginaSeNecessario(proximaAltura) {
        if (y + proximaAltura > alturaPagina - 45) {
          pdf.addPage();
          y = 55;
        }
      }

      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(14);
      pdf.text(d.codigo || '', margemEsq, y);
      y += 20;
      pdf.setFontSize(13);
      const linhasTitulo = pdf.splitTextToSize(d.titulo || '(sem título)', larguraUtil);
      pdf.text(linhasTitulo, margemEsq, y);
      y += linhasTitulo.length * 16 + 6;

      pdf.setDrawColor(180);
      pdf.line(margemEsq, y, margemEsq + larguraUtil, y);
      y += 16;

      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(9.5);
      pdf.setTextColor(90);
      pdf.text(`Categoria: ${d.categoria || '—'}      Revisão: ${d.revisao || '—'}`, margemEsq, y);
      y += 24;
      pdf.setTextColor(0);

      pdf.setFontSize(10.5);
      const conteudo = d.conteudo || '(documento ainda sem conteúdo)';
      const paragrafos = conteudo.split('\n');
      paragrafos.forEach(paragrafo => {
        const linhas = pdf.splitTextToSize(paragrafo === '' ? ' ' : paragrafo, larguraUtil);
        linhas.forEach(linha => {
          quebraDePaginaSeNecessario(14);
          pdf.text(linha, margemEsq, y);
          y += 14;
        });
      });

      const nomeArquivo = `${(d.codigo || 'documento').trim()} - ${(d.titulo || '').trim()} rev ${d.revisao || '00'}.pdf`
        .replace(/[\\/:*?"<>|]+/g, '-');
      pdf.save(nomeArquivo);
    }

    async function carregarHistorico(id) {
      const area = document.getElementById('doc-historico-area');
      area.innerHTML = '<div class="doc-aviso-historico-vazio">Carregando histórico...</div>';
      try {
        const q = query(collection(db, 'biblioteca_documentos', id, 'versoes_obsoletas'), orderBy('obsoletoEm', 'desc'));
        const snap = await getDocs(q);
        if (snap.empty) {
          area.innerHTML = '<div class="doc-aviso-historico-vazio">Este documento ainda não teve nenhuma revisão substituída.</div>';
          return;
        }
        area.innerHTML = snap.docs.map(docSnap => {
          const v = docSnap.data();
          const data = v.obsoletoEm && v.obsoletoEm.toDate ? v.obsoletoEm.toDate().toLocaleString('pt-BR') : '';
          return `
            <details class="doc-historico-item">
              <summary>Revisão ${escapeHtml(v.revisao || '—')} — tornou-se obsoleta em ${escapeHtml(data)}</summary>
              <div class="doc-conteudo-leitura">${escapeHtml(v.conteudo || '')}</div>
            </details>
          `;
        }).join('');
      } catch (err) {
        console.error('Erro ao carregar histórico:', err);
        area.innerHTML = '<div class="doc-aviso-historico-vazio">Não foi possível carregar o histórico agora.</div>';
      }
    }

    // ---------------------------------------------------------------
    // DRAWER — EDIÇÃO / CRIAÇÃO
    // ---------------------------------------------------------------
    function abrirEdicao(id) {
      docEmEdicaoId = id;
      const d = id ? documentosCarregados.find(x => x.id === id) : null;
      const categoriaAtual = d ? d.categoria : '';
      const categoriaEhPadrao = CATEGORIAS_PADRAO.includes(categoriaAtual);

      document.getElementById('doc-drawer-titulo').textContent = d ? 'Editar documento' : 'Novo documento';
      document.getElementById('doc-drawer-subtitulo').textContent = d
        ? `Salvar vai criar a revisão ${proximaRevisao(d.revisao)} e mover a revisão ${d.revisao || '—'} atual para o histórico.`
        : 'Preencha os dados do novo documento.';

      const corpo = document.getElementById('doc-drawer-corpo');
      corpo.innerHTML = `
        <div class="doc-form">
          <div class="doc-form-linha">
            <div>
              <label>Categoria</label>
              <select id="doc-form-categoria">
                ${CATEGORIAS_PADRAO.map(c => `<option value="${escapeHtml(c)}" ${c === categoriaAtual ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
                <option value="__outra__" ${!categoriaEhPadrao && categoriaAtual ? 'selected' : ''}>Outra...</option>
              </select>
            </div>
            <div id="doc-form-categoria-outra-wrap" style="display:${!categoriaEhPadrao && categoriaAtual ? 'block' : 'none'};">
              <label>Nome da categoria</label>
              <input type="text" id="doc-form-categoria-outra" value="${!categoriaEhPadrao ? escapeHtml(categoriaAtual) : ''}">
            </div>
          </div>
          <div class="doc-form-linha">
            <div>
              <label>Código (ex: PG 01, IT 05, DF 10)</label>
              <input type="text" id="doc-form-codigo" value="${escapeHtml(d ? d.codigo : '')}" ${d ? 'readonly' : ''}>
            </div>
            <div>
              <label>Título</label>
              <input type="text" id="doc-form-titulo" value="${escapeHtml(d ? d.titulo : '')}">
            </div>
          </div>
          <label>Conteúdo do documento</label>
          <textarea id="doc-form-conteudo">${escapeHtml(d ? d.conteudo || '' : '')}</textarea>
          <div class="doc-form-rodape">
            <button type="button" class="qc-btn" id="doc-form-cancelar">Cancelar</button>
            <button type="button" class="qc-btn qc-btn-primary" id="doc-form-salvar">
              ${d ? 'Salvar nova revisão' : 'Criar documento'}
            </button>
          </div>
        </div>
      `;

      document.getElementById('doc-form-categoria').addEventListener('change', (e) => {
        document.getElementById('doc-form-categoria-outra-wrap').style.display = e.target.value === '__outra__' ? 'block' : 'none';
      });
      document.getElementById('doc-form-cancelar').addEventListener('click', () => (d ? abrirLeitura(id) : fecharDrawer()));
      document.getElementById('doc-form-salvar').addEventListener('click', () => salvarDocumento(id));

      abrirDrawer();
    }

    async function salvarDocumento(idExistente) {
      const btnSalvar = document.getElementById('doc-form-salvar');
      const categoriaSelect = document.getElementById('doc-form-categoria').value;
      const categoriaOutra = document.getElementById('doc-form-categoria-outra')?.value || '';
      const categoria = proximaCategoriaCustomOuPadrao(categoriaSelect, categoriaOutra);
      const codigo = document.getElementById('doc-form-codigo').value.trim();
      const titulo = document.getElementById('doc-form-titulo').value.trim();
      const conteudo = document.getElementById('doc-form-conteudo').value;

      if (!categoria || !codigo || !titulo) {
        alert('Preencha ao menos categoria, código e título.');
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando...';

      try {
        if (idExistente) {
          const atual = documentosCarregados.find(x => x.id === idExistente);
          const docRef = doc(db, 'biblioteca_documentos', idExistente);

          if (atual && atual.conteudo !== undefined) {
            await addDoc(collection(docRef, 'versoes_obsoletas'), {
              revisao: atual.revisao || '',
              titulo: atual.titulo || '',
              conteudo: atual.conteudo || '',
              obsoletoEm: serverTimestamp()
            });
          }

          await updateDoc(docRef, {
            categoria, codigo, titulo, conteudo,
            revisao: proximaRevisao(atual ? atual.revisao : '0'),
            atualizadoEm: serverTimestamp(),
            atualizadoPor: (perfilAtual && perfilAtual.unidade) || ''
          });
        } else {
          const novoId = `${slugificar(categoria)}--${slugificar(codigo)}`;
          const existente = documentosCarregados.find(x => x.id === novoId);
          const docRef = doc(db, 'biblioteca_documentos', novoId);

          if (existente) {
            if (!confirm('Já existe um documento com esse código nessa categoria. Quer sobrescrever (vira uma nova revisão dele)?')) {
              btnSalvar.disabled = false;
              btnSalvar.textContent = 'Criar documento';
              return;
            }
            await addDoc(collection(docRef, 'versoes_obsoletas'), {
              revisao: existente.revisao || '',
              titulo: existente.titulo || '',
              conteudo: existente.conteudo || '',
              obsoletoEm: serverTimestamp()
            });
            await updateDoc(docRef, {
              categoria, codigo, titulo, conteudo,
              revisao: proximaRevisao(existente.revisao),
              atualizadoEm: serverTimestamp(),
              atualizadoPor: (perfilAtual && perfilAtual.unidade) || ''
            });
          } else {
            await setDoc(docRef, {
              categoria, codigo, titulo, conteudo,
              revisao: '01',
              atualizadoEm: serverTimestamp(),
              atualizadoPor: (perfilAtual && perfilAtual.unidade) || ''
            });
          }
        }

        fecharDrawer();
      } catch (err) {
        console.error('Erro ao salvar documento:', err);
        alert('Não foi possível salvar o documento agora.');
        btnSalvar.disabled = false;
        btnSalvar.textContent = idExistente ? 'Salvar nova revisão' : 'Criar documento';
      }
    }

    // ---------------------------------------------------------------
    // DRAWER — abrir/fechar
    // ---------------------------------------------------------------
    function abrirDrawer() {
      document.getElementById('doc-drawer-overlay').classList.add('open');
      document.getElementById('doc-drawer').classList.add('open');
    }

    function fecharDrawer() {
      document.getElementById('doc-drawer-overlay').classList.remove('open');
      document.getElementById('doc-drawer').classList.remove('open');
      docEmEdicaoId = null;
    }
  </script>
</body>
