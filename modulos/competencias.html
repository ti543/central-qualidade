<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG 22 - Controle de Competências</title>
  <link href="../assets/layout.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #000080;
      --secondary-color: #000050;
      --light-bg: #f4f6f9;
      --border-color: #ccc;
      --success-bg: #c6efce; --success-text: #006100;
      --alert-bg: #ffeb9c; --alert-text: #9c6500;
      --danger-bg: #ffc7ce; --danger-text: #9c0006;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; background-color: var(--light-bg); padding-bottom: 60px; }

    /* CABEÇALHO GLOBAL NORMATIVO */
    /* BARRA DE CONTROLES DO MODULO (ficha ISO) */
    .module-controls-bar { display: flex; align-items: center; justify-content: flex-end; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .header-meta-vertical { display: flex; flex-direction: column; gap: 4px; background: #f8f9fa; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 11px; min-width: 130px; }
    .header-meta-vertical div { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; color: #555; }
    .header-meta-vertical input { border: none; background: transparent; font-weight: bold; width: 65px; text-align: right; color: #333; font-size: 11px; }

    .main-layout { display: flex; min-height: 80vh; margin: 0 15px; gap: 15px; }
    .sidebar { width: 260px; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; height: fit-content; }
    .sidebar h3 { font-size: 11px; text-transform: uppercase; color: #777; margin: 15px 0 5px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }

    .nav-btn { width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 3px; border: none; background: transparent; border-radius: 4px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #495057; display: flex; justify-content: space-between; align-items: center; }
    .nav-btn:hover { background: #f0f2f5; }
    .nav-btn.active { background: var(--primary-color); color: white; }

    .content-area { flex: 1; min-width: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 25px; }
    .card h2 { font-size: 14px; color: var(--primary-color); margin-bottom: 15px; border-left: 4px solid var(--primary-color); padding-left: 10px; text-transform: uppercase; }
    .card h3 { font-size: 12px; color: var(--secondary-color); margin: 10px 0 8px; }

    .table-responsive { overflow-x: auto; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
    .excel-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 11px; }
    .excel-table th, .excel-table td { padding: 6px; border: 1px solid #bbb; overflow: hidden; text-overflow: ellipsis; position: relative; white-space: nowrap; vertical-align: middle; }
    .excel-table th { background: var(--primary-color); color: white; font-weight: 600; font-size: 10.5px; white-space: normal; word-break: break-word; text-overflow: clip; line-height: 1.25; }
    .excel-table td.txt-l, .excel-table th.txt-l { text-align: left; white-space: normal; }

    .matrix-table { width: auto; table-layout: fixed; }
    .matrix-table td:nth-child(2) { text-align: left; white-space: normal; }

    /* CONTROLE DE LARGURA DE COLUNAS (compartilhado entre todas as abas) */
    .size-control-wrapper { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

    .input-cell { width: 100%; border: none; background: transparent; text-align: center; font-size: 11px; padding: 3px 2px; font-weight: inherit; color: inherit; font-family: inherit; }
    .input-cell:focus { background: white; outline: 2px solid var(--primary-color); border-radius: 2px; }
    .input-cell.txt-l { text-align: left; }

    .v { background-color: var(--success-bg) !important; color: var(--success-text) !important; font-weight: bold; }
    .a { background-color: var(--alert-bg) !important; color: var(--alert-text) !important; font-weight: bold; }
    .d { background-color: var(--danger-bg) !important; color: var(--danger-text) !important; font-weight: bold; }
    .cel-req { background: #dbe9ff; font-weight: bold; cursor: pointer; color: var(--primary-color); }
    .cel-req:hover { background: #b9d3ff; }
    .cel-na { color: #bbb; cursor: pointer; }
    .cel-na:hover { background: #f0f0f0; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: bold; }
    .badge.v { background: var(--success-bg); color: var(--success-text); }
    .badge.a { background: var(--alert-bg); color: var(--alert-text); }
    .badge.d { background: var(--danger-bg); color: var(--danger-text); }
    .badge.n { background: #e2e3e5; color: #555; }

    .btn-action { background: var(--primary-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-right: 5px; }
    .btn-action.danger { background: #dc3545; }
    .btn-action.grey { background: #6c757d; }
    .btn-action.green { background: #28a745; }

    /* FILTROS */
    .filter-bar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
    .filter-bar input, .filter-bar select { padding: 6px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .filter-bar input[type="text"] { min-width: 200px; }

    /* DASHBOARD */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 5px; }
    .stat-tile { background: #fff; border: 1px solid #ddd; border-left: 5px solid var(--primary-color); border-radius: 6px; padding: 14px 16px; }
    .stat-tile .num { font-size: 26px; font-weight: 800; color: var(--primary-color); }
    .stat-tile .lbl { font-size: 11px; color: #666; text-transform: uppercase; font-weight: 600; margin-top: 4px; }
    .stat-tile.v { border-left-color: #28a745; } .stat-tile.v .num { color: #28a745; }
    .stat-tile.a { border-left-color: #e6a700; } .stat-tile.a .num { color: #e6a700; }
    .stat-tile.d { border-left-color: #dc3545; } .stat-tile.d .num { color: #dc3545; }

    .unit-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
    .unit-bar-row .unit-name { width: 60px; font-weight: bold; color: var(--secondary-color); }
    .unit-bar-track { flex: 1; background: #eee; border-radius: 6px; height: 16px; overflow: hidden; }
    .unit-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), #3a5fd9); border-radius: 6px; }
    .unit-bar-val { width: 90px; text-align: right; font-weight: bold; color: #555; }

    /* FICHA FUNCIONÁRIO (DRAWER) */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; z-index: 9000; }
    .drawer-overlay.open { display: block; }
    .drawer-panel { position: fixed; top: 0; right: -720px; width: 720px; max-width: 96vw; height: 100vh; background: #f4f6f9; z-index: 9001; box-shadow: -6px 0 25px rgba(0,0,0,0.25); transition: right 0.25s ease; overflow-y: auto; }
    .drawer-panel.open { right: 0; }
    .drawer-header { background: var(--primary-color); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2; }
    .drawer-header h2 { font-size: 15px; text-transform: uppercase; }
    .drawer-header .sub { font-size: 11px; opacity: 0.85; font-weight: normal; text-transform: none; }
    .close-btn { background: rgba(255,255,255,0.15); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
    .drawer-body { padding: 18px 20px; }
    .ficha-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    .ficha-info-grid div span { display: block; }
    .ficha-info-grid .k { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
    .ficha-info-grid .val { font-size: 13px; font-weight: bold; color: var(--secondary-color); }

    .comp-item { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; }
    .comp-item-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .comp-item-top .nome { font-weight: bold; font-size: 12.5px; color: #333; }
    .comp-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .comp-fields label { font-size: 9.5px; font-weight: bold; color: #777; text-transform: uppercase; display: block; margin-bottom: 3px; }
    .comp-fields input, .comp-fields select { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 11.5px; }

    .empty-msg { padding: 30px; text-align: center; color: #888; font-weight: 600; }

    .size-control-box { display: inline-flex; align-items: center; gap: 10px; background: #fff; padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; font-weight: bold; color: var(--primary-color); margin-bottom: 10px; }

    /* LOGIN / ACESSO (Firebase) */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--light-bg); }
    .login-card { background: white; border-radius: 10px; border-top: 5px solid var(--primary-color); box-shadow: 0 8px 25px rgba(0,0,0,0.1); padding: 30px; width: 100%; max-width: 380px; }
    .login-card img { max-height: 50px; display: block; margin: 0 auto 14px; }
    .login-card h2 { text-align: center; font-size: 15px; color: var(--primary-color); text-transform: uppercase; margin-bottom: 20px; }
    .login-card label { display: block; font-size: 11px; font-weight: bold; color: #666; margin-bottom: 4px; }
    .login-card input { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; margin-bottom: 14px; }
    .login-card button { width: 100%; background: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; }

    #access-denied { display: none; align-items: center; justify-content: center; min-height: 100vh; background: var(--light-bg); text-align: center; }
    .access-denied-card { background: white; border-radius: 10px; border-top: 5px solid var(--danger-text); box-shadow: 0 8px 25px rgba(0,0,0,0.1); padding: 40px; max-width: 460px; }
    .access-denied-card h2 { color: var(--danger-text); margin: 12px 0; }
    .access-denied-card button { margin-top: 16px; background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }

  </style>
</head>

: "Operador de empilhadeira", "unidade": "GRU", "status": "Desligado"}, {"cod": 267, "nome": "Willian Gomes Chimendes", "funcao": "Ajudante", "unidade": "ITJ", "status": "Desligado"}, {"cod": 268, "nome": "Willian Matheus dos Santos Chimendes", "funcao": "Ajudante", "unidade": "ITJ", "status": "Desligado"}, {"cod": 297, "nome": "Wendel Santos Reis", "funcao": "Ajudante", "unidade": "GRU", "status": "Ativo"}, {"cod": 270, "nome": "Willman Jose Diaz Romero", "funcao": "Ajudante", "unidade": "RSL", "status": "Desligado"}, {"cod": 298, "nome": "Wesley de Jesus Ferreira", "funcao": "Ajudante", "unidade": "GRU", "status": "Ativo"}, {"cod": 299, "nome": "Wesley Luis da Silva do Nascimento", "funcao": "Auxiliar de expedição", "unidade": "RSL", "status": "Ativo"}, {"cod": 300, "nome": "Willians Jose Villalta", "funcao": "Ajudante", "unidade": "RSL", "status": "Ativo"}, {"cod": 308, "nome": "Wilman Jose Mendez Villalta", "funcao": "Ajudante", "unidade": "RSL", "status": "Ativo"}, {"cod": 301, "nome": "Wilson dos Santos Prieto", "funcao": "Conferente", "unidade": "GRU", "status": "Ativo"}, {"cod": 302, "nome": "Wilson Francisco dos Santos", "funcao": "Encarregado de depósito", "unidade": "GRU", "status": "Ativo"}, {"cod": 303, "nome": "Zarildo dos Santos", "funcao": "Ajudante", "unidade": "ITJ", "status": "Ativo"}]};

    const UNIDADES = ["GRU","RSL","ITJ","CTB","POA","CMP"];

    /* =========================================================
       ESTADO / PERSISTÊNCIA
       ========================================================= */
    // "var" (não "let") no escopo de topo vira propriedade de window — necessário para o
    // script type="module" do Firebase (mais abaixo) conseguir ler/substituir os dados.
    var db = JSON.parse(localStorage.getItem('rg22_db_v1'));

    function construirInstrutoresSeed(processos) {
      return processos.map((nome, idx) => {
        if (idx === 20) {
          return { temMaterial:'-', temProva:'-', instrutor:'Empresa externa', qualificados:'-', horasTreinamento:'-', horasRequalificacao:'-', periodo:'-', consulta:'-' };
        }
        if (idx >= 35) {
          return { temMaterial:'', temProva:'', instrutor:'', qualificados:'', horasTreinamento:'', horasRequalificacao:'', periodo:'', consulta:'' };
        }
        return { temMaterial:'Sim', temProva:'Não', instrutor:'Danrlei Dolzan', qualificados:'Sim', horasTreinamento:1, horasRequalificacao:1, periodo:'Anual', consulta:'-' };
      });
    }

    if (!db) {
      db = {
        meta: { elab: '03/04/23', rev: '02/12/25', num: '01' },
        processos: RG22_SEED.processos,
        cargos: JSON.parse(JSON.stringify(RG22_SEED.cargos)),
        funcionarios: RG22_SEED.employees.map((e, i) => ({ id: i, ...e })),
        treinos: {},
        instrutores: construirInstrutoresSeed(RG22_SEED.processos),
        atestados: []
      };
      salvarDB();
    }
    // migração defensiva (garante presença de todas as chaves em bancos já existentes ou vindos do Firebase)
    function garantirEstruturaDB() {
      if (!db.treinos) db.treinos = {};
      if (!db.atestados) db.atestados = [];
      if (!db.instrutores) db.instrutores = construirInstrutoresSeed(db.processos);
      if (!db.meta) db.meta = { elab: '03/04/23', rev: '02/12/25', num: '01' };
    }
    garantirEstruturaDB();

    function salvarDB() {
      localStorage.setItem('rg22_db_v1', JSON.stringify(db));
      if (window.salvarNoFirebase) window.salvarNoFirebase(db);
    }
    function salvarMeta(campo, valor) { db.meta[campo] = valor; salvarDB(); }

    let abaAtiva = 'dashboard';
    let fichaFuncAtivo = null;

    // filtros
    let filtroFuncTexto = '', filtroFuncUnidade = '', filtroFuncStatus = 'Ativo';
    let filtroPendUnidade = '', filtroPendProcesso = '', filtroPendTipo = '';

    // largura de colunas (compartilhada por todas as abas): coluna "identificadora" (nome/cargo/competência) e colunas de dados
    let colWidthLabel = parseInt(localStorage.getItem('rg22_colw_label') || '220', 10);
    let colWidthData = parseInt(localStorage.getItem('rg22_colw_data') || '100', 10);

    function mudarLargura(tipo, v) {
      v = parseInt(v, 10);
      if (tipo === 'label') { colWidthLabel = v; localStorage.setItem('rg22_colw_label', v); }
      else { colWidthData = v; localStorage.setItem('rg22_colw_data', v); }
      renderTela();
    }

    function controlesLargura() {
      return `
        <div class="size-control-wrapper edit-only">
          <div class="size-control-box">
            <span>Largura da coluna de nome:</span>
            <input type="range" min="120" max="380" value="${colWidthLabel}" oninput="mudarLargura('label', this.value)">
            <span>${colWidthLabel}px</span>
          </div>
          <div class="size-control-box">
            <span>Largura das colunas de dados:</span>
            <input type="range" min="50" max="220" value="${colWidthData}" oninput="mudarLargura('data', this.value)">
            <span>${colWidthData}px</span>
          </div>
        </div>
      `;
    }

    // <colgroup> trava a largura de cada coluna. Com table-layout:fixed e width:auto,
    // o Chrome ignora a soma das colunas e encolhe a tabela para caber no container —
    // por isso a própria tabela também precisa do width explícito (soma das colunas).
    function colgroup(widths) {
      return '<colgroup>' + widths.map(w => `<col style="width:${w}px;">`).join('') + '</colgroup>';
    }
    function somaPx(widths) { return widths.reduce((a, w) => a + w, 0); }

    /* =========================================================
       UTILITÁRIOS DE DATA / STATUS (equivalentes às fórmulas do Excel)
       ========================================================= */
    function hojeStr() { return new Date().toISOString().slice(0,10); }
    // Aceita só "AAAA-MM-DD" válido — protege contra valores que vieram da planilha
    // sem ser data de verdade (ex.: célula com o texto "Instrutor" em vez de uma data).
    function dataValida(s) {
      if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
      return !isNaN(new Date(s + 'T00:00:00').getTime());
    }
    function addDias(dataStr, dias) {
      if (!dataValida(dataStr)) return '';
      const d = new Date(dataStr + 'T00:00:00');
      d.setDate(d.getDate() + dias);
      return d.toISOString().slice(0,10);
    }
    function fmtBR(dataStr) {
      if (!dataValida(dataStr)) return '-';
      const [y,m,d] = dataStr.split('-');
      return `${d}/${m}/${y}`;
    }
    function diffDias(dataStr) {
      if (!dataValida(dataStr)) return null;
      return Math.floor((new Date(dataStr + 'T00:00:00') - new Date(hojeStr() + 'T00:00:00')) / 86400000);
    }
    function normaliza(s) { return (s || '').toString().trim().toLowerCase(); }

    function getCargoPorFuncao(funcaoNome) {
      return db.cargos.find(c => normaliza(c.nome) === normaliza(funcaoNome));
    }

    function chaveTreino(funcId, procIdx) { return funcId + '_' + procIdx; }

    function getTreino(funcId, procIdx) {
      return db.treinos[chaveTreino(funcId, procIdx)] || { data: '', statusEf: '-' };
    }

    function situacaoTreino(treino) {
      if (!treino || !dataValida(treino.data)) return { label: 'Pendente', cls: 'd' };
      if (treino.statusEf === 'R') return { label: 'Refazer', cls: 'd' };
      const dataEf = addDias(treino.data, 90);
      if (treino.statusEf !== 'OK' && dataEf && dataEf < hojeStr()) return { label: 'Verificar eficácia', cls: 'a' };
      return { label: 'Realizado', cls: 'v' };
    }

    function alertaPrazoAtestado(dataBase) {
      if (!dataValida(dataBase)) return { label: '-', cls: 'n' };
      const dataAval = addDias(dataBase, 90);
      const dif = diffDias(dataAval);
      if (dif === null) return { label: '-', cls: 'n' };
      if (dif < 0) return { label: 'Vencido', cls: 'd' };
      if (dif <= 30) return { label: 'Ciclo de vencimento', cls: 'a' };
      return { label: 'No prazo', cls: 'v' };
    }

    /* =========================================================
       NAVEGAÇÃO
       ========================================================= */
    function trocarAba(id) {
      abaAtiva = id;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('menu-btn-' + id);
      if (btn) btn.classList.add('active');
      renderTela();
    }

    function renderTela() {
      const alvo = document.getElementById('painel-principal-conteudo');
      if (abaAtiva === 'dashboard') alvo.innerHTML = renderDashboard();
      else if (abaAtiva === 'cargos') alvo.innerHTML = renderCargos();
      else if (abaAtiva === 'funcionarios') alvo.innerHTML = renderFuncionarios();
      else if (abaAtiva === 'pendencias') alvo.innerHTML = renderPendencias();
      else if (abaAtiva === 'atestados') alvo.innerHTML = renderAtestados();
      else if (abaAtiva === 'instrutor') alvo.innerHTML = renderInstrutor();
    }

    /* =========================================================
       CÁLCULOS AGREGADOS (usados no Dashboard e Pendências)
       ========================================================= */
    function listaPendenciasFuncionario(func) {
      const cargo = getCargoPorFuncao(func.funcao);
      const pend = [];
      if (!cargo || func.status !== 'Ativo') return pend;
      cargo.req.forEach(procIdx => {
        const treino = getTreino(func.id, procIdx);
        const sit = situacaoTreino(treino);
        if (sit.cls !== 'v') pend.push({ func, procIdx, treino, sit });
      });
      return pend;
    }

    function todasPendencias() {
      let out = [];
      db.funcionarios.forEach(f => { out = out.concat(listaPendenciasFuncionario(f)); });
      return out;
    }

    /* =========================================================
       DASHBOARD
       ========================================================= */
    function renderDashboard() {
      const ativos = db.funcionarios.filter(f => f.status === 'Ativo');
      const desligados = db.funcionarios.filter(f => f.status === 'Desligado');
      const pendencias = todasPendencias();
      const funcComPend = new Set(pendencias.map(p => p.func.id)).size;

      let barrasUnidade = '';
      UNIDADES.forEach(u => {
        const qtd = ativos.filter(f => f.unidade === u).length;
        const pct = ativos.length ? (qtd / ativos.length * 100) : 0;
        barrasUnidade += `
          <div class="unit-bar-row">
            <span class="unit-name">${u}</span>
            <div class="unit-bar-track"><div class="unit-bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
            <span class="unit-bar-val">${qtd} (${pct.toFixed(0)}%)</span>
          </div>`;
      });

      const noPrazo = db.atestados.filter(a => alertaPrazoAtestado(a.dataBase).label === 'No prazo').length;
      const ciclo = db.atestados.filter(a => alertaPrazoAtestado(a.dataBase).label === 'Ciclo de vencimento').length;
      const vencido = db.atestados.filter(a => alertaPrazoAtestado(a.dataBase).label === 'Vencido').length;

      return `
        <div class="card">
          <h2>📊 Visão Geral</h2>
          <div class="stat-grid">
            <div class="stat-tile"><div class="num">${db.cargos.length}</div><div class="lbl">Cargos cadastrados</div></div>
            <div class="stat-tile"><div class="num">${db.processos.length}</div><div class="lbl">Competências / treinamentos</div></div>
            <div class="stat-tile v"><div class="num">${ativos.length}</div><div class="lbl">Funcionários ativos</div></div>
            <div class="stat-tile d"><div class="num">${desligados.length}</div><div class="lbl">Funcionários desligados</div></div>
          </div>
        </div>

        <div class="card">
          <h2>🏭 Distribuição de Funcionários Ativos por Unidade</h2>
          ${barrasUnidade || '<div class="empty-msg">Sem funcionários ativos cadastrados.</div>'}
        </div>

        <div class="card">
          <h2>⚠️ Resumo de Pendências (Treinamento / Eficácia)</h2>
          <div class="stat-grid">
            <div class="stat-tile d"><div class="num">${pendencias.length}</div><div class="lbl">Pendências em aberto</div></div>
            <div class="stat-tile a"><div class="num">${funcComPend}</div><div class="lbl">Funcionários com pendência</div></div>
          </div>
          <p style="margin-top:10px; font-size:11px; color:#777;">Veja a lista completa e filtrável na aba <b>⚠️ Pendências</b>.</p>
        </div>

        <div class="card">
          <h2>🎓 Resumo — Atestado de Qualificação</h2>
          <div class="stat-grid">
            <div class="stat-tile v"><div class="num">${noPrazo}</div><div class="lbl">No prazo</div></div>
            <div class="stat-tile a"><div class="num">${ciclo}</div><div class="lbl">Ciclo de vencimento</div></div>
            <div class="stat-tile d"><div class="num">${vencido}</div><div class="lbl">Vencido</div></div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       CARGOS x COMPETÊNCIAS
       ========================================================= */
    function toggleReq(cargoIdx, procIdx) {
      const cargo = db.cargos[cargoIdx];
      const pos = cargo.req.indexOf(procIdx);
      if (pos >= 0) cargo.req.splice(pos, 1); else cargo.req.push(procIdx);
      salvarDB();
      renderTela();
    }

    function novoCargo() {
      const nome = prompt('Nome do novo cargo:');
      if (!nome) return;
      const maxCod = db.cargos.reduce((m, c) => Math.max(m, c.cod || 0), 0);
      db.cargos.push({ cod: maxCod + 1, nome, setor: '', status: 'Ativo', req: [] });
      salvarDB();
      renderTela();
    }

    function excluirCargo(idx) {
      if (!confirm('Excluir este cargo?')) return;
      db.cargos.splice(idx, 1);
      salvarDB();
      renderTela();
    }

    function renderCargos() {
      const cw = colWidthData;
      let head = `<th style="width:50px;">Cód</th><th style="width:${colWidthLabel}px;">Cargo / Setor</th>`;
      db.processos.forEach((p, idx) => {
        head += `<th style="width:${cw}px;" title="${p.replace(/"/g,'&quot;')}">${p}</th>`;
      });
      head += `<th style="width:110px;">Status</th><th style="width:60px;" class="edit-only">Ação</th>`;

      let body = '';
      db.cargos.forEach((cargo, cIdx) => {
        let statusCls = cargo.status === 'Ativo' ? 'v' : (cargo.status === 'Cancelado' ? 'd' : 'a');
        body += `<tr>
          <td style="width:50px;">${cargo.cod ?? ''}</td>
          <td class="txt-l" style="width:${colWidthLabel}px;"><input class="input-cell txt-l" style="font-weight:bold;" value="${cargo.nome}" onchange="db.cargos[${cIdx}].nome=this.value; salvarDB(); renderTela();">
            <input class="input-cell txt-l" style="font-size:10px; color:#777;" value="${cargo.setor||''}" placeholder="Setor" onchange="db.cargos[${cIdx}].setor=this.value; salvarDB();"></td>`;
        db.processos.forEach((p, pIdx) => {
          const req = cargo.req.includes(pIdx);
          body += `<td class="${req ? 'cel-req' : 'cel-na'}" style="width:${cw}px;" onclick="toggleReq(${cIdx}, ${pIdx})" title="${p.replace(/"/g,'&quot;')}">${req ? 'x' : 'na'}</td>`;
        });
        body += `<td style="width:110px;"><select class="input-cell ${statusCls}" style="font-weight:bold;" onchange="db.cargos[${cIdx}].status=this.value; salvarDB(); renderTela();">
            <option value="Ativo" ${cargo.status==='Ativo'?'selected':''}>Ativo</option>
            <option value="Cancelado" ${cargo.status==='Cancelado'?'selected':''}>Cancelado</option>

          </select></td>
          <td class="edit-only" style="width:60px;"><button class="btn-action danger" style="padding:3px 8px;" onclick="excluirCargo(${cIdx})">X</button></td>
        </tr>`;
      });

      return `
        <div class="card">
          <h2>🧩 Matriz de Cargos x Competências</h2>
          <p style="font-size:11.5px; color:#666; margin-bottom:10px;">Clique em uma célula para marcar/desmarcar a competência exigida para o cargo (equivalente à aba "Proc. por cargos" do Excel). Passe o mouse sobre a célula para ver o nome completo da competência.</p>
          ${controlesLargura()}
          <div class="edit-only" style="margin-bottom:10px;"><button class="btn-action green" onclick="novoCargo()">+ Novo Cargo</button></div>
          <div class="table-responsive">
            <table class="excel-table matrix-table" style="width:${somaPx([50, colWidthLabel, ...db.processos.map(() => cw), 110, 60])}px;">
              ${colgroup([50, colWidthLabel, ...db.processos.map(() => cw), 110, 60])}
              <thead><tr>${head}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================
       FUNCIONÁRIOS (lista + ficha individual)
       ========================================================= */
    function atualizarFuncionario(fid, campo, valor) {
      const f = db.funcionarios.find(x => x.id === fid);
      if (!f) return;
      f[campo] = valor;
      salvarDB();
      renderTela();
      if (fichaFuncAtivo === fid) renderFicha();
    }

    function renderFuncionarios() {
      let lista = db.funcionarios.filter(f => {
        if (filtroFuncStatus && f.status !== filtroFuncStatus) return false;
        if (filtroFuncUnidade && f.unidade !== filtroFuncUnidade) return false;
        if (filtroFuncTexto && !normaliza(f.nome).includes(normaliza(filtroFuncTexto)) && !normaliza(f.funcao).includes(normaliza(filtroFuncTexto))) return false;
        return true;
      });
      lista = lista.slice().sort((a,b) => a.nome.localeCompare(b.nome));

      let linhas = '';
      lista.forEach(f => {
        const pend = listaPendenciasFuncionario(f).length;
        const cargo = getCargoPorFuncao(f.funcao);
        const elegiveis = cargo ? cargo.req.length : 0;
        linhas += `<tr>
          <td style="width:55px;">${f.cod ?? ''}</td>
          <td class="txt-l" style="font-weight:bold; width:${colWidthLabel}px;">${f.nome}</td>
          <td class="txt-l" style="width:${colWidthData}px;">${f.funcao}</td>
          <td style="width:${colWidthData}px;">${f.unidade || '-'}</td>
          <td style="width:${colWidthData}px;">
            <select class="input-cell ${f.status==='Ativo'?'v':'d'}" style="font-weight:bold;" onchange="atualizarFuncionario(${f.id}, 'status', this.value)">
              <option value="Ativo" ${f.status==='Ativo'?'selected':''}>Ativo</option>
              <option value="Desligado" ${f.status==='Desligado'?'selected':''}>Desligado</option>
            </select>
          </td>
          <td style="width:${colWidthData}px;">${elegiveis}</td>
          <td style="width:${colWidthData}px;">${pend > 0 ? `<span class="badge d">${pend}</span>` : `<span class="badge v">0</span>`}</td>
          <td style="width:${colWidthData}px;"><button class="btn-action" style="padding:4px 9px;" onclick="abrirFicha(${f.id})">Ver Ficha</button></td>
        </tr>`;
      });

      if (!linhas) linhas = `<tr><td colspan="8" class="empty-msg">Nenhum funcionário encontrado para os filtros aplicados.</td></tr>`;

      return `
        <div class="card">
          <h2>👥 Funcionários (${lista.length})</h2>
          <div class="filter-bar">
            <input type="text" placeholder="Buscar por nome ou função..." value="${filtroFuncTexto}" oninput="filtroFuncTexto=this.value; renderTela();">
            <select onchange="filtroFuncUnidade=this.value; renderTela();">
              <option value="">Todas as unidades</option>
              ${UNIDADES.map(u => `<option value="${u}" ${filtroFuncUnidade===u?'selected':''}>${u}</option>`).join('')}
            </select>
            <select onchange="filtroFuncStatus=this.value; renderTela();">
              <option value="">Todos os status</option>
              <option value="Ativo" ${filtroFuncStatus==='Ativo'?'selected':''}>Ativo</option>
              <option value="Desligado" ${filtroFuncStatus==='Desligado'?'selected':''}>Desligado</option>
            </select>
          </div>
          ${controlesLargura()}
          <div class="table-responsive">
            <table class="excel-table matrix-table" style="width:${somaPx([55, colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}px;">
              ${colgroup([55, colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}
              <thead><tr>
                <th style="width:55px;">Cód</th><th style="width:${colWidthLabel}px;">Funcionário</th><th style="width:${colWidthData}px;">Função</th>
                <th style="width:${colWidthData}px;">Unidade</th><th style="width:${colWidthData}px;">Status</th><th style="width:${colWidthData}px;">Competências</th>
                <th style="width:${colWidthData}px;">Pendências</th><th style="width:${colWidthData}px;">Ação</th>
              </tr></thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function abrirFicha(funcId) {
      fichaFuncAtivo = funcId;
      renderFicha();
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('drawer-ficha').classList.add('open');
    }

    function fecharFicha() {
      document.getElementById('drawer-overlay').classList.remove('open');
      document.getElementById('drawer-ficha').classList.remove('open');
      fichaFuncAtivo = null;
    }

    function atualizarTreinoData(funcId, procIdx, valor) {
      const key = chaveTreino(funcId, procIdx);
      if (!db.treinos[key]) db.treinos[key] = { data: '', statusEf: '-' };
      db.treinos[key].data = valor;
      salvarDB();
      renderFicha();
      if (abaAtiva === 'funcionarios') renderTela();
    }

    function atualizarTreinoStatusEf(funcId, procIdx, valor) {
      const key = chaveTreino(funcId, procIdx);
      if (!db.treinos[key]) db.treinos[key] = { data: '', statusEf: '-' };
      db.treinos[key].statusEf = valor;
      salvarDB();
      renderFicha();
    }

    function renderFicha() {
      const func = db.funcionarios.find(f => f.id === fichaFuncAtivo);
      if (!func) return;
      const cargo = getCargoPorFuncao(func.funcao);
      document.getElementById('ficha-titulo').innerText = func.nome;
      document.getElementById('ficha-subtitulo').innerText = `${func.funcao} · Unidade ${func.unidade || '-'} · Cód ${func.cod ?? ''}`;

      const nomesCargos = db.cargos.map(c => c.nome).slice().sort((a,b) => a.localeCompare(b));
      const opcoesFuncao = nomesCargos.includes(func.funcao) ? nomesCargos : [func.funcao, ...nomesCargos];

      let corpo = `
        <div class="ficha-info-grid">
          <div><span class="k">Função</span>
            <select class="val" style="width:100%; padding:4px; border:1px solid #ccc; border-radius:4px;" onchange="atualizarFuncionario(${func.id}, 'funcao', this.value)">
              ${opcoesFuncao.map(n => `<option value="${n.replace(/"/g,'&quot;')}" ${func.funcao===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
          <div><span class="k">Unidade</span>
            <select class="val" style="width:100%; padding:4px; border:1px solid #ccc; border-radius:4px;" onchange="atualizarFuncionario(${func.id}, 'unidade', this.value)">
              ${UNIDADES.map(u => `<option value="${u}" ${func.unidade===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
          <div><span class="k">Status</span><span class="val"><span class="badge ${func.status==='Ativo'?'v':'d'}">${func.status}</span></span></div>
          <div><span class="k">Competências elegíveis</span><span class="val">${cargo ? cargo.req.length : 0}</span></div>
        </div>
      `;

      if (!cargo || cargo.req.length === 0) {
        corpo += `<div class="empty-msg">Nenhuma competência exigida cadastrada para a função "${func.funcao}". Ajuste em "Cargos x Competências".</div>`;
      } else {
        corpo += `<h3 style="margin-bottom:10px; color:var(--primary-color); font-size:12.5px; text-transform:uppercase;">Competências elegíveis</h3>`;
        cargo.req.forEach(procIdx => {
          const treino = getTreino(func.id, procIdx);
          const sit = situacaoTreino(treino);
          const dataEf = addDias(treino.data, 90);
          corpo += `
            <div class="comp-item">
              <div class="comp-item-top">
                <span class="nome">${db.processos[procIdx]}</span>
                <span class="badge ${sit.cls}">${sit.label}</span>
              </div>
              <div class="comp-fields">
                <div>
                  <label>Data do treinamento</label>
                  <input type="date" value="${treino.data || ''}" onchange="atualizarTreinoData(${func.id}, ${procIdx}, this.value)">
                </div>
                <div>
                  <label>Verif. eficácia (+90 dias)</label>
                  <input type="text" value="${dataEf ? fmtBR(dataEf) : '-'}" disabled>
                </div>
                <div>
                  <label>Status da eficácia</label>
                  <select onchange="atualizarTreinoStatusEf(${func.id}, ${procIdx}, this.value)">
                    <option value="-" ${treino.statusEf==='-'?'selected':''}>-</option>
                    <option value="OK" ${treino.statusEf==='OK'?'selected':''}>OK</option>
                    <option value="R" ${treino.statusEf==='R'?'selected':''}>R (Refazer)</option>
                  </select>
                </div>
              </div>
            </div>
          `;
        });
      }

      document.getElementById('ficha-corpo').innerHTML = corpo;
    }

    /* =========================================================
       PENDÊNCIAS
       ========================================================= */
    function renderPendencias() {
      let pend = todasPendencias();
      if (filtroPendUnidade) pend = pend.filter(p => p.func.unidade === filtroPendUnidade);
      if (filtroPendProcesso !== '') pend = pend.filter(p => p.procIdx === parseInt(filtroPendProcesso));
      if (filtroPendTipo) pend = pend.filter(p => p.sit.label === filtroPendTipo);

      pend = pend.slice().sort((a,b) => a.func.nome.localeCompare(b.func.nome));

      let linhas = pend.map(p => `
        <tr class="${p.sit.cls}">
          <td class="txt-l" style="width:${colWidthLabel}px;"><b>${p.func.nome}</b></td>
          <td class="txt-l" style="width:${colWidthData}px;">${p.func.funcao}</td>
          <td style="width:${colWidthData}px;">${p.func.unidade || '-'}</td>
          <td class="txt-l" style="width:${colWidthData}px;">${db.processos[p.procIdx]}</td>
          <td style="width:${colWidthData}px;">${p.treino.data ? fmtBR(p.treino.data) : '-'}</td>
          <td style="width:${colWidthData}px;"><span class="badge ${p.sit.cls}">${p.sit.label}</span></td>
          <td style="width:${colWidthData}px;"><button class="btn-action" style="padding:3px 8px;" onclick="abrirFicha(${p.func.id})">Ver Ficha</button></td>
        </tr>
      `).join('');

      if (!linhas) linhas = `<tr><td colspan="7" class="empty-msg">Nenhuma pendência encontrada para os filtros selecionados. 🎉</td></tr>`;

      return `
        <div class="card">
          <h2>⚠️ Painel de Pendências (Treinamento e Verificação de Eficácia)</h2>
          <div class="filter-bar">
            <select onchange="filtroPendUnidade=this.value; renderTela();">
              <option value="">Todas as unidades</option>
              ${UNIDADES.map(u => `<option value="${u}" ${filtroPendUnidade===u?'selected':''}>${u}</option>`).join('')}
            </select>
            <select onchange="filtroPendProcesso=this.value; renderTela();">
              <option value="">Todas as competências</option>
              ${db.processos.map((p,idx) => `<option value="${idx}" ${filtroPendProcesso==String(idx)?'selected':''}>${p}</option>`).join('')}
            </select>
            <select onchange="filtroPendTipo=this.value; renderTela();">
              <option value="">Todos os tipos</option>
              <option value="Pendente" ${filtroPendTipo==='Pendente'?'selected':''}>Pendente (sem treinamento)</option>
              <option value="Verificar eficácia" ${filtroPendTipo==='Verificar eficácia'?'selected':''}>Verificar eficácia</option>
              <option value="Refazer" ${filtroPendTipo==='Refazer'?'selected':''}>Refazer</option>
            </select>
            <button class="btn-action grey" onclick="filtroPendUnidade='';filtroPendProcesso='';filtroPendTipo='';renderTela();">Limpar Filtros</button>
          </div>
          ${controlesLargura()}
          <div class="table-responsive">
            <table class="excel-table matrix-table" style="width:${somaPx([colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}px;">
              ${colgroup([colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}
              <thead><tr>
                <th style="width:${colWidthLabel}px;">Funcionário</th><th style="width:${colWidthData}px;">Função</th><th style="width:${colWidthData}px;">Unidade</th>
                <th style="width:${colWidthData}px;">Competência</th><th style="width:${colWidthData}px;">Data Treino</th><th style="width:${colWidthData}px;">Situação</th><th style="width:${colWidthData}px;">Ação</th>
              </tr></thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================
       ATESTADO DE QUALIFICAÇÃO
       ========================================================= */
    function novoAtestado() {
      db.atestados.push({ funcCod: '', funcao: '', unidade: '', funcaoProposta: '', motivo: '-', dataBase: '' });
      salvarDB();
      renderTela();
    }

    function atualizarAtestadoFuncionario(idx, funcId) {
      const func = db.funcionarios.find(f => f.id === parseInt(funcId));
      const at = db.atestados[idx];
      at.funcId = func ? func.id : '';
      at.funcao = func ? func.funcao : '';
      at.unidade = func ? func.unidade : '';
      salvarDB();
      renderTela();
    }

    function atualizarAtestadoCampo(idx, campo, valor) {
      db.atestados[idx][campo] = valor;
      salvarDB();
      renderTela();
    }

    function excluirAtestado(idx) {
      if (!confirm('Excluir este registro?')) return;
      db.atestados.splice(idx, 1);
      salvarDB();
      renderTela();
    }

    function renderAtestados() {
      const ativos = db.funcionarios.filter(f => f.status === 'Ativo').slice().sort((a,b)=>a.nome.localeCompare(b.nome));

      let linhas = db.atestados.map((at, idx) => {
        const dataAval = addDias(at.dataBase, 90);
        const alerta = alertaPrazoAtestado(at.dataBase);
        return `
          <tr>
            <td class="txt-l" style="width:${colWidthLabel}px;">
              <select class="input-cell txt-l" onchange="atualizarAtestadoFuncionario(${idx}, this.value)">
                <option value="">Selecione...</option>
                ${ativos.map(f => `<option value="${f.id}" ${at.funcId===f.id?'selected':''}>${f.nome}</option>`).join('')}
              </select>
            </td>
            <td class="txt-l" style="width:${colWidthData}px;">${at.funcao || '-'}</td>
            <td style="width:${colWidthData}px;">${at.unidade || '-'}</td>
            <td class="txt-l" style="width:${colWidthData}px;"><input class="input-cell txt-l" value="${at.funcaoProposta||''}" placeholder="Função proposta" onchange="atualizarAtestadoCampo(${idx}, 'funcaoProposta', this.value)"></td>
            <td style="width:${colWidthData}px;">
              <select class="input-cell" onchange="atualizarAtestadoCampo(${idx}, 'motivo', this.value)">
                <option value="-" ${at.motivo==='-'?'selected':''}>-</option>
                <option value="Admissão" ${at.motivo==='Admissão'?'selected':''}>Admissão</option>
                <option value="Movimentação" ${at.motivo==='Movimentação'?'selected':''}>Movimentação</option>
                <option value="Reavaliação" ${at.motivo==='Reavaliação'?'selected':''}>Reavaliação</option>
              </select>
            </td>
            <td style="width:${colWidthData}px;"><input type="date" class="input-cell" value="${at.dataBase||''}" onchange="atualizarAtestadoCampo(${idx}, 'dataBase', this.value)"></td>
            <td style="width:${colWidthData}px;">${dataAval ? fmtBR(dataAval) : '-'}</td>
            <td style="width:${colWidthData}px;"><span class="badge ${alerta.cls}">${alerta.label}</span></td>
            <td class="edit-only" style="width:60px;"><button class="btn-action danger" style="padding:3px 8px;" onclick="excluirAtestado(${idx})">X</button></td>
          </tr>
        `;
      }).join('');

      if (!linhas) linhas = `<tr><td colspan="9" class="empty-msg">Nenhum registro de atestado de qualificação. Clique em "+ Novo Registro" para adicionar.</td></tr>`;

      return `
        <div class="card">
          <h2>🎓 Atestado de Qualificação</h2>
          <p style="font-size:11.5px; color:#666; margin-bottom:10px;">Registro de admissão, movimentação ou reavaliação de função. A data de avaliação é calculada automaticamente (data base + 90 dias) e o alerta de prazo é atualizado em tempo real.</p>
          <div class="edit-only" style="margin-bottom:10px;"><button class="btn-action green" onclick="novoAtestado()">+ Novo Registro</button></div>
          ${controlesLargura()}
          <div class="table-responsive">
            <table class="excel-table matrix-table" style="width:${somaPx([colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, 60])}px;">
              ${colgroup([colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, 60])}
              <thead><tr>
                <th style="width:${colWidthLabel}px;">Funcionário</th><th style="width:${colWidthData}px;">Função Atual</th><th style="width:${colWidthData}px;">Unidade</th>
                <th style="width:${colWidthData}px;">Função Proposta</th><th style="width:${colWidthData}px;">Motivo</th><th style="width:${colWidthData}px;">Data Base</th>
                <th style="width:${colWidthData}px;">Data Avaliação</th><th style="width:${colWidthData}px;">Alerta de Prazo</th><th style="width:60px;" class="edit-only">Ação</th>
              </tr></thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================
       CONTROLE DE INSTRUTOR
       ========================================================= */
    function atualizarInstrutorCampo(idx, campo, valor) {
      db.instrutores[idx][campo] = valor;
      salvarDB();
    }

    function renderInstrutor() {
      let linhas = db.processos.map((nome, idx) => {
        const it = db.instrutores[idx] || {};
        return `
          <tr>
            <td style="width:40px;">${idx + 1}</td>
            <td class="txt-l" style="width:${colWidthLabel}px;">${nome}</td>
            <td style="width:${colWidthData}px;">
              <select class="input-cell" onchange="atualizarInstrutorCampo(${idx}, 'temMaterial', this.value)">
                ${['-','Sim','Não'].map(o => `<option value="${o}" ${it.temMaterial===o?'selected':''}>${o}</option>`).join('')}
              </select>
            </td>
            <td style="width:${colWidthData}px;">
              <select class="input-cell" onchange="atualizarInstrutorCampo(${idx}, 'temProva', this.value)">
                ${['-','Sim','Não'].map(o => `<option value="${o}" ${it.temProva===o?'selected':''}>${o}</option>`).join('')}
              </select>
            </td>
            <td class="txt-l" style="width:${colWidthData}px;"><input class="input-cell txt-l" value="${it.instrutor||''}" onchange="atualizarInstrutorCampo(${idx}, 'instrutor', this.value)"></td>
            <td style="width:${colWidthData}px;">
              <select class="input-cell" onchange="atualizarInstrutorCampo(${idx}, 'qualificados', this.value)">
                ${['-','Sim','Não'].map(o => `<option value="${o}" ${it.qualificados===o?'selected':''}>${o}</option>`).join('')}
              </select>
            </td>
            <td style="width:${colWidthData}px;"><input class="input-cell" value="${it.horasTreinamento??''}" onchange="atualizarInstrutorCampo(${idx}, 'horasTreinamento', this.value)"></td>
            <td style="width:${colWidthData}px;"><input class="input-cell" value="${it.horasRequalificacao??''}" onchange="atualizarInstrutorCampo(${idx}, 'horasRequalificacao', this.value)"></td>
            <td style="width:${colWidthData}px;"><input class="input-cell" value="${it.periodo||''}" onchange="atualizarInstrutorCampo(${idx}, 'periodo', this.value)"></td>
            <td style="width:${colWidthData}px;"><input class="input-cell" value="${it.consulta||''}" onchange="atualizarInstrutorCampo(${idx}, 'consulta', this.value)"></td>
          </tr>
        `;
      }).join('');

      return `
        <div class="card">
          <h2>🧑‍🏫 Controle de Instrutor</h2>
          ${controlesLargura()}
          <div class="table-responsive">
            <table class="excel-table matrix-table" style="width:${somaPx([40, colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}px;">
              ${colgroup([40, colWidthLabel, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData, colWidthData])}
              <thead><tr>
                <th style="width:40px;">Nº</th><th style="width:${colWidthLabel}px;">Treinamento / Competência</th>
                <th style="width:${colWidthData}px;">Tem material?</th><th style="width:${colWidthData}px;">Tem prova?</th>
                <th style="width:${colWidthData}px;">Instrutor</th><th style="width:${colWidthData}px;">Qualificados</th>
                <th style="width:${colWidthData}px;">Horas treino</th><th style="width:${colWidthData}px;">Horas requalif.</th>
                <th style="width:${colWidthData}px;">Período requalif.</th><th style="width:${colWidthData}px;">Consulta?</th>
              </tr></thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */
    window.onload = function () {
      if (db.meta.elab) document.getElementById('iso-elab').value = db.meta.elab;
      if (db.meta.rev) document.getElementById('iso-rev').value = db.meta.rev;
      if (db.meta.num) document.getElementById('iso-num').value = db.meta.num;
      renderTela();
    };
  </script>

  <script type="module">
    import { auth, db as firestoreDb } from '../firebase-config.js';
    import { doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { initLayout } from '../assets/layout.js';

    const dbDocRef = doc(firestoreDb, "rg22_competencias", "dados");

    let firestoreUnsub = null;

    initLayout({
      auth, db: firestoreDb,
      activeSlug: 'competencias',
      pageTitle: 'RG 22 - Controle de Competências',
      breadcrumb: 'Qualidade',
      homeHref: '../index.html',
      papelExigido: 'qualidade'
    }).then(() => {
      document.getElementById('carregando').style.display = 'none';

      window.salvarNoFirebase = function (dbObj) {
        setDoc(dbDocRef, dbObj).catch(err => console.error('Erro ao salvar no Firebase:', err));
      };

      if (firestoreUnsub) firestoreUnsub();
      firestoreUnsub = onSnapshot(dbDocRef, (snap) => {
        if (snap.exists()) {
          window.db = snap.data();
          window.garantirEstruturaDB();
          localStorage.setItem('rg22_db_v1', JSON.stringify(window.db));
          if (window.db.meta) {
            document.getElementById('iso-elab').value = window.db.meta.elab || '';
            document.getElementById('iso-rev').value = window.db.meta.rev || '';
            document.getElementById('iso-num').value = window.db.meta.num || '';
          }
          window.renderTela();
        } else {
          // primeira vez que este módulo é usado: grava a carga inicial no Firebase
          setDoc(dbDocRef, window.db);
        }
      });
    }).catch(err => console.error('Falha ao montar layout:', err));
  </script>
</body>
</html>
